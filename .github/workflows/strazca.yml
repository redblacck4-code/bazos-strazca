name: Bazoš strážca

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: strazca
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Prejdi Bazoš
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_PROFIT: ${{ vars.MIN_PROFIT || '60' }}
        run: python bazos_strazca.py
      - name: Ulož videné inzeráty
        run: |
          git config user.name "strazca-bot"
          git config user.email "strazca-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet && exit 0
          git commit -m "update seen.json"
          git pull --rebase -X theirs origin main || true
          git push || echo "Push sa nepodaril – nevadí, skúsi sa pri ďalšom behu"
